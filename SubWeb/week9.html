<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Mix</title>

    <!-- I used many help from generative AI to allign seemless img repetition -->

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        
    </style>
</head>

<body>
    
    <a href="../index.html"><img src='../Resource/Animation/close scroll gif.gif' class="return-scroll"></a>

    <header class="hero-header"><h1>Recipe of Week 9</h1></header>

    <a href="week8.html"><img src='../Resource/Animation/flip backward.gif' class="return-scroll bottom-left"></a>
    <a href="week10.html"><img src='../Resource/Animation/flip forward.gif' class="return-scroll bottom-right"></a>

    <div class="content"></div>

    <!-- lightbox container -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" style="display:none;" />
        <video id="lightbox-video" controls style="display:none;"></video>
    </div>

    <script>
    $(document).ready(function () {

        const lightbox = $('#lightbox');
        const lightboxImg = $('#lightbox-img');
        const lightboxVideo = $('#lightbox-video');

        function openImage(src) {
            lightboxVideo.hide();
            lightboxImg.attr('src', src).show();
            lightbox.css('display', 'flex');
        }

        function openVideo(src) {
            lightboxImg.hide();
            lightboxVideo.attr('src', src)[0].play();
            lightboxVideo.show();
            lightbox.css('display', 'flex');
        }

        lightbox.on('click', function () {
            lightbox.hide();
            lightboxVideo[0].pause();
            lightboxVideo.attr('src', '');
        });

        Papa.parse('week9.csv', {
            download: true,
            header: true,
            complete: function (results) {

                const container = $('.content');

                results.data.forEach(function (row) {

                    if (!row) return;

                    const section = $('<div>').addClass('section');

                    // IMAGES
                    if (row.Images) {
                        row.Images.split(';').forEach(function (imgUrl) {
                            if (imgUrl.trim()) {
                                const img = $('<img>').attr('src', imgUrl.trim());
                                img.on('click', function () {
                                    openImage($(this).attr('src'));
                                });
                                section.append(img);
                            }
                        });
                    }

                    // VIDEOS
                    if (row.Videos) {
                        row.Videos.split(';').forEach(function (videoUrl) {
                            if (videoUrl.trim()) {
                                const video = $('<video controls>')
                                    .attr('src', videoUrl.trim());

                                video.on('click', function (e) {
                                    // prevent opening when clicking native controls
                                    if (e.target === this) {
                                        openVideo($(this).attr('src'));
                                    }
                                });

                                section.append(video);
                            }
                        });
                    }

                    // LINKS
                    if (row.LinkURLs) {
                        const urls = row.LinkURLs.split(';');
                        const labels = row.LinkTexts ? row.LinkTexts.split(';') : [];

                        urls.forEach(function (url, i) {
                            url = url.trim();
                            if (url) {
                                const label = (labels[i] && labels[i].trim()) ? labels[i].trim() : url;

                                section.append(
                                    $('<a>')
                                        .attr('href', url)
                                        .text(label)
                                );
                            }
                        });
                    }

                    // TEXTS
                    if (row.Texts) {
                        row.Texts.split(';').forEach(function (text) {
                            if (text.trim()) {
                                section.append(
                                    $('<p>').text(text.trim())
                                );
                            }
                        });
                    }

                    container.append(section);
                });
            }
        });

    });
    </script>

</body>
</html>
